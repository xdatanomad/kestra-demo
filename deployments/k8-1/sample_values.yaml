workerGroups:
  workergroupone:
    # resources:
    #   limits:
    #     cpu:
    #     memory:
    #   requests:
    #     cpu:
    #     memory:
    extraEnv:
    - name: SECRET_WORKER_VALUE
      value: workergroupone
    enabled: true
  workergrouptwo:
    # resources:
    #   limits:
    #     cpu:
    #     memory:
    #   requests:
    #     cpu:
    #     memory:
    extraEnv:
    - name: SECRET_WORKER_VALUE
      value : workergrouptwo
    enabled: true
deployments:
  executor:
    command: server executor
    enabled: false
    kind: Deployment
    strategy:
      type: Recreate
  indexer:
    command: server indexer
    enabled: false
    kind: Deployment
  scheduler:
    command: server scheduler
    enabled: false
    kind: Deployment
    strategy:
      type: Recreate
  standalone:
    enabled: false
  webserver:
    livenessProbe:
      httpGet:
        path: /health/liveness
        port: management
      failureThreshold: 3
      initialDelaySeconds: 0
      periodSeconds: 5
      successThreshold: 1
      timeoutSeconds: 3
    readinessProbe:
      httpGet:
        path: /health/readiness
        port: management
      failureThreshold: 3
      initialDelaySeconds: 0
      periodSeconds: 5
      successThreshold: 1
      timeoutSeconds: 3
    # exists
    startupProbe:
      httpGet:
        path: /health
        port: management
      failureThreshold: 120
      initialDelaySeconds: 1
      periodSeconds: 1
      successThreshold: 1
      timeoutSeconds: 1
    terminationGracePeriodSeconds: 30
    affinity: {}
    annotations: {}
    autoscaler:
      enabled: false
      extra: {}
      maxReplicas: 3
      metrics: []
      minReplicas: 1
    command: server webserver
    enabled: true
    extraContainers: []
    extraEnv: []
    kind: Deployment
    labels: {}
    nodeSelector: {}
    podSecurityContext: {}
    replicaCount: 1
    securityContext: {}
    strategy:
      type: Recreate
    tolerations: []
  worker:
    command: server worker{{ if $.Values.deployments.worker.workerThreads }} --thread={{
      .Values.deployments.worker.workerThreads }}{{ end }}
    enabled: false
    kind: Deployment
    strategy:
      type: Recreate
    terminationGracePeriodSeconds: 60
dind:
  base:
    args:
    - --log-level=fatal
    - --group=1000
    rootless:
      image:
        pullPolicy: IfNotPresent
        repository: docker
        tag: dind-rootless
    securityContext:
      runAsGroup: 1000
      runAsUser: 1000
  enabled: false
  extraEnv: []
  extraVolumeMounts: []
  mode: rootless
  resources: {}
  socketPath: /dind/
  tmpPath: /tmp/
elasticsearch:
  enabled: false

ingress:
  annotations: null
  className: alb
  enabled: false
  hosts:
  - host: ""
    paths:
    - path: /
      pathType: Prefix
  tls: []
kafka:
  enabled: false
minio:
  enabled: false
nameOverride: ""
operator:
  enabled: false
postgresql:
  enabled: false

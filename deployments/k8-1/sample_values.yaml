image:
  pullPolicy: IfNotPresent
  repository: registry.kestra.io/docker/kestra-ee
  tag: v1.2
imagePullSecrets:
- name: regcred
############ EE ############
common:
  strategy:
    type: Recreate
  affinity: {}
  annotations: {}
  extraConfigMapEnvFrom: null
  extraContainers: []
  extraEnv: []
  extraManifests: []
  extraPorts: []
  extraSecretEnvFrom: null
  extraVolumeMounts: []
  extraVolumes: []
  livenessProbe:
    failureThreshold: 3
    initialDelaySeconds: 0
    periodSeconds: 5
    successThreshold: 1
    timeoutSeconds: 3
  readinessProbe:
    failureThreshold: 3
    initialDelaySeconds: 0
    periodSeconds: 5
    successThreshold: 1
    timeoutSeconds: 3
  startupProbe:
    failureThreshold: 120
    initialDelaySeconds: 1
    periodSeconds: 1
    successThreshold: 1
    timeoutSeconds: 1
  terminationGracePeriodSeconds: 30
  nodeSelector: {}
  podAnnotations: {}
  podSecurityContext: {}
  resources: {}
  securityContext:
    runAsGroup: 1000
    runAsUser: 1000
  tolerations: []

name: Sync Kestra Namespace Files

on:
  push:
    branches:
      - kestra  # Triggers on commits to the kestra branch
  pull_request:
    branches:
      - kestra  # Triggers when a PR is opened/updated against the kestra branch
    types: [closed] # Optional: only trigger if PR is merged

jobs:
  trigger-kestra:
    # If using PR trigger, ensure we only run on push or merged PRs
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    
    steps:
      - name: Send Webhook to Kestra
        run: |
          curl -X POST "https://partners.kestra.cloud/api/v1/executions/webhook/system/github_sys_sync_namespacefiles/${{ secrets.KESTRA_WEBHOOK_KEY }}" \
          -H "Content-Type: application/json" \
          -d '{
            "commit_sha": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "actor": "${{ github.actor }}",
            "message": "Triggered by GitHub Action"
          }'
